services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.8.3
    ports: ["8123:8123"]
    volumes:
      - ./config:/config
      - ../custom_components/seasonal_groceries:/config/custom_components/seasonal_groceries:ro

  # Optional Mealie for seeding test recipes at http://localhost:9925 (dev only).
  # Tag is unpinned because the pinned tag could not be verified offline from the registry.
  mealie:
    image: ghcr.io/mealie-recipes/mealie:latest
    ports: ["9925:9000"]
    environment:
      ALLOW_SIGNUP: "false"
      BASE_URL: http://localhost:9925
    volumes:
      - ./mealie-data:/app/data
