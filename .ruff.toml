# The contents of this file is based on https://github.com/home-assistant/core/blob/dev/pyproject.toml

target-version = "py314"

[lint]
select = [
    "ALL",
]

ignore = [
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "D203", # no-blank-line-before-class (incompatible with formatter)
    "D212", # multi-line-summary-first-line (incompatible with formatter)
    "COM812", # incompatible with formatter
    "ISC001", # incompatible with formatter
    "CPY001", # missing copyright header - known, accepted repo-wide gap
]

[lint.flake8-pytest-style]
fixture-parentheses = false

[lint.pyupgrade]
keep-runtime-typing = true

[lint.mccabe]
max-complexity = 25

[lint.per-file-ignores]
"tests/*" = [
    "S101", # assert is how pytest tests assertions
    "ARG001", # fixtures like setup_integration are used for their side effect, not their value
    "D103", # test function names already say what they check
    "PLR2004", # magic numbers are the expected values in assertions
    "D104", # tests/__init__.py is an empty marker file
    "S105", # fake tokens in tests
    "S106", # fake tokens in tests
]

"custom_components/*/__init__.py" = [
    "ARG001", # Home Assistant calls async_setup/async_setup_entry/async_unload_entry with fixed signatures
]

"custom_components/*/config_flow.py" = [
    "ARG002", # flow step signatures are fixed by Home Assistant
    "ARG004", # async_get_options_flow(config_entry) has a fixed signature
]
